
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOP - Register</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 background:linear-gradient(160deg,#fff 25%,#eff7ed);
 color:#202820;
}
.container{
 width:100%;
 max-width:500px;
 margin:auto;
 padding:0 5% 35px;
}
.logo-area{
 height:390px;
 display:flex;
 align-items:center;
 justify-content:center;
}
.logo{
 width:130px;
 height:130px;
 background:#080808;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:43px;
 font-weight:900;
 letter-spacing:-4px;
 border:5px solid #080808;
}
.logo span{color:#13a45a}
.form-area{width:100%}
input{
 width:100%;
 height:86px;
 border:1px solid #e9eeea;
 background:#fff;
 border-radius:11px;
 padding:0 19px;
 margin-bottom:35px;
 font-size:19px;
 outline:none;
 color:#222;
 box-shadow:0 2px 5px #00000003;
}
input:focus{border-color:#087b43}
.phone-wrap{
 display:flex;
 align-items:center;
 height:86px;
 border:1px solid #e9eeea;
 background:white;
 border-radius:11px;
 margin-bottom:35px;
 padding:0 18px;
}
.phone-wrap span{font-size:21px;color:#555;margin-right:12px}
.phone-wrap input{
 height:100%;
 border:0;
 margin:0;
 padding:0;
 box-shadow:none;
 min-width:0;
}
.main-btn{
 width:100%;
 height:84px;
 border:0;
 border-radius:50px;
 color:white;
 font-size:25px;
 font-weight:bold;
 background:linear-gradient(105deg,#07854b,#00331e);
 margin-top:10px;
}
.switch{
 text-align:center;
 margin-top:55px;
 font-size:19px;
}
.switch button{
 border:0;
 background:transparent;
 font-weight:bold;
 font-size:20px;
 margin-left:10px;
}
#message{
 text-align:center;
 font-size:14px;
 margin-top:18px;
 color:#087b43;
 line-height:1.5;
}
.hidden{display:none}
@media(max-height:800px){
 .logo-area{height:260px}
 input,.phone-wrap{height:65px;margin-bottom:20px}
 .main-btn{height:68px}
 .switch{margin-top:35px}
}
</style>
</head>
<body>
<div class="container">

 <div class="logo-area">
  <div class="logo">SH<span>O</span>P</div>
 </div>

 <div class="form-area">

  <form id="registerForm">
   <div class="phone-wrap">
    <span>+880</span>
    <input id="phone" type="tel" placeholder="আপনার মোবাইল নম্বর লিখুন" required>
   </div>

   <input id="password" type="password"
   placeholder="লগইন পাসওয়ার্ড" minlength="8" required>

   <input id="confirmPassword" type="password"
   placeholder="পাসওয়ার্ড আবার লিখুন" minlength="8" required>

   <input id="referral" type="text"
   placeholder="রেফারেল কোড (ঐচ্ছিক)">

   <button class="main-btn" type="submit">রেজিস্টার করুন</button>
  </form>

  <form id="loginForm" class="hidden">
   <div class="phone-wrap">
    <span>+880</span>
    <input id="loginPhone" type="tel"
    placeholder="আপনার মোবাইল নম্বর লিখুন" required>
   </div>

   <input id="loginPassword" type="password"
   placeholder="লগইন পাসওয়ার্ড" required>

   <button class="main-btn" type="submit">লগইন করুন</button>
  </form>

  <p id="message"></p>

  <div class="switch" id="registerSwitch">
   ইতিমধ্যে রেজিস্টার করেছেন?
   <button onclick="showLogin()">লগইন</button>
  </div>

  <div class="switch hidden" id="loginSwitch">
   অ্যাকাউন্ট নেই?
   <button onclick="showRegister()">রেজিস্টার</button>
  </div>

 </div>
</div>

<script>
const registerForm=document.getElementById('registerForm');
const loginForm=document.getElementById('loginForm');
const message=document.getElementById('message');

function showLogin(){
 registerForm.classList.add('hidden');
 loginForm.classList.remove('hidden');
 document.getElementById('registerSwitch').classList.add('hidden');
 document.getElementById('loginSwitch').classList.remove('hidden');
 message.textContent='';
}

function showRegister(){
 loginForm.classList.add('hidden');
 registerForm.classList.remove('hidden');
 document.getElementById('loginSwitch').classList.add('hidden');
 document.getElementById('registerSwitch').classList.remove('hidden');
 message.textContent='';
}

registerForm.addEventListener('submit',async function(e){
 e.preventDefault();

 const phone=document.getElementById('phone').value.trim();
 const password=document.getElementById('password').value;
 const confirm=document.getElementById('confirmPassword').value;
 const referral=document.getElementById('referral').value.trim();

 if(!/^[0-9]{10}$/.test(phone)){
  message.textContent='সঠিক ১০ সংখ্যার মোবাইল নম্বর লিখুন।';
  return;
 }
 if(password!==confirm){
  message.textContent='দুইটি পাসওয়ার্ড মিলছে না।';
  return;
 }

 message.textContent='রেজিস্ট্রেশন সার্ভার প্রস্তুত করা বাকি।';
});

loginForm.addEventListener('submit',function(e){
 e.preventDefault();
 message.textContent='লগইন সার্ভার প্রস্তুত করা বাকি।';
});
</script>
</body>
</html>
