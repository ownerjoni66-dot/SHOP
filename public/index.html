
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOP - Register</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 background:linear-gradient(160deg,#fff 25%,#eff7ed);
 color:#202820;
}

.container{
 width:100%;
 max-width:420px;
 margin:auto;
 padding:10px 20px 20px;
}

.logo-area{
 height:190px;
 display:flex;
 align-items:center;
 justify-content:center;
}

.logo{
 width:95px;
 height:95px;
 background:#080808;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:33px;
 font-weight:900;
 letter-spacing:-4px;
 border:4px solid #080808;
}

.logo span{color:#13a45a}

.form-area{width:100%}

input{
 width:100%;
 height:55px;
 border:1px solid #e9eeea;
 background:#fff;
 border-radius:10px;
 padding:0 14px;
 margin-bottom:13px;
 font-size:15px;
 outline:none;
 color:#222;
}

input:focus{border-color:#087b43}

.phone-wrap{
 display:flex;
 align-items:center;
 height:55px;
 border:1px solid #e9eeea;
 background:white;
 border-radius:10px;
 margin-bottom:13px;
 padding:0 13px;
}

.phone-wrap span{
 font-size:16px;
 color:#555;
 margin-right:10px;
}

.phone-wrap input{
 height:100%;
 border:0;
 margin:0;
 padding:0;
 box-shadow:none;
 min-width:0;
}

.main-btn{
 width:100%;
 height:56px;
 border:0;
 border-radius:40px;
 color:white;
 font-size:18px;
 font-weight:bold;
 background:linear-gradient(105deg,#07854b,#00331e);
 margin-top:4px;
}

.switch{
 text-align:center;
 margin-top:22px;
 font-size:14px;
}

.switch button{
 border:0;
 background:transparent;
 font-weight:bold;
 font-size:15px;
 margin-left:7px;
 color:#087b43;
}

#message{
 text-align:center;
 font-size:13px;
 margin-top:12px;
 color:#087b43;
 line-height:1.5;
}

.hidden{display:none}

@media(max-height:700px){
 .logo-area{height:130px}
 .container{padding-top:5px}
 .switch{margin-top:15px}
}
</style>
</head>

<body>
<div class="container">

 <div class="logo-area">
  <div class="logo">SH<span>O</span>P</div>
 </div>

 <div class="form-area">

  <form id="registerForm">
   <div class="phone-wrap">
    <span>+880</span>
    <input id="phone" type="tel"
    placeholder="আপনার মোবাইল নম্বর লিখুন" required>
   </div>

   <input id="password" type="password"
   placeholder="লগইন পাসওয়ার্ড" minlength="8" required>

   <input id="confirmPassword" type="password"
   placeholder="পাসওয়ার্ড আবার লিখুন" minlength="8" required>

   <input id="referral" type="text"
   placeholder="রেফারেল কোড (ঐচ্ছিক)">

   <button class="main-btn" type="submit">রেজিস্টার করুন</button>
  </form>

  <form id="loginForm" class="hidden">
   <div class="phone-wrap">
    <span>+880</span>
    <input id="loginPhone" type="tel"
    placeholder="আপনার মোবাইল নম্বর লিখুন" required>
   </div>

   <input id="loginPassword" type="password"
   placeholder="লগইন পাসওয়ার্ড" required>

   <button class="main-btn" type="submit">লগইন করুন</button>
  </form>

  <p id="message"></p>

  <div class="switch" id="registerSwitch">
   ইতিমধ্যে রেজিস্টার করেছেন?
   <button type="button" onclick="showLogin()">লগইন</button>
  </div>

  <div class="switch hidden" id="loginSwitch">
   অ্যাকাউন্ট নেই?
   <button type="button" onclick="showRegister()">রেজিস্টার</button>
  </div>

 </div>
</div>

<script>
const registerForm=document.getElementById('registerForm');
const loginForm=document.getElementById('loginForm');
const message=document.getElementById('message');

function showLogin(){
 registerForm.classList.add('hidden');
 loginForm.classList.remove('hidden');
 document.getElementById('registerSwitch').classList.add('hidden');
 document.getElementById('loginSwitch').classList.remove('hidden');
 message.textContent='';
}

function showRegister(){
 loginForm.classList.add('hidden');
 registerForm.classList.remove('hidden');
 document.getElementById('loginSwitch').classList.add('hidden');
 document.getElementById('registerSwitch').classList.remove('hidden');
 message.textContent='';
}

registerForm.addEventListener('submit',function(e){
 e.preventDefault();

 const phone=document.getElementById('phone').value.trim();
 const password=document.getElementById('password').value;
 const confirm=document.getElementById('confirmPassword').value;

 if(!/^[0-9]{10}$/.test(phone)){
  message.textContent='সঠিক ১০ সংখ্যার মোবাইল নম্বর লিখুন।';
  return;
 }

 if(password!==confirm){
  message.textContent='দুইটি পাসওয়ার্ড মিলছে না।';
  return;
 }

 message.textContent='Registration server এখনো যুক্ত করা হয়নি।';
});

loginForm.addEventListener('submit',function(e){
 e.preventDefault();
 message.textContent='Login server এখনো যুক্ত করা হয়নি।';
});
</script>
</body>
</html>
